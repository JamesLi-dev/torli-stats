name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    # The integrated Notes UI uses macOS 15 SwiftUI APIs (for example,
    # WindowDragGesture), so the release compiler must use the macOS 15/Xcode 16 image.
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify community boundary and tests
        run: |
          python3 scripts/check-community-boundary.py
          swift test

      - name: Verify release architecture
        run: |
          ARCH="$(uname -m)"
          if [[ "$ARCH" != "arm64" ]]; then
            echo "Expected an arm64 runner for the macos-arm64 release, got: $ARCH" >&2
            exit 1
          fi

      - name: Determine release version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be a semantic version (major.minor.patch); got: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=TorliStats-$VERSION-macos-arm64.zip" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$TAG is already released; skipping publication. Bump VERSION for the next release."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build app
        if: steps.release.outputs.publish == 'true'
        env:
          CODE_SIGN_IDENTITY: "-"
          SKIP_INSTALL: "1"
        run: ./build-app.sh

      - name: Archive app
        if: steps.release.outputs.publish == 'true'
        env:
          ARCHIVE_NAME: ${{ steps.version.outputs.archive }}
        run: ditto -c -k --sequesterRsrc --keepParent TorliStats.app "$ARCHIVE_NAME"

      - name: Prepare Homebrew cask and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ARCHIVE_NAME: ${{ steps.version.outputs.archive }}
        run: |
          if [[ ! -f "$ARCHIVE_NAME" ]]; then
            gh release download "$TAG" --pattern "$ARCHIVE_NAME"
          fi
          SHA256="$(shasum -a 256 "$ARCHIVE_NAME" | cut -d ' ' -f 1)"
          export SHA256
          ruby -e '
            cask = File.read("Casks/torli-stats.rb")
            abort "Expected one cask version" unless cask.scan(/^  version "[^"]+"$/).size == 1
            abort "Expected one cask sha256" unless cask.scan(/^  sha256 "[0-9a-f]{64}"$/).size == 1
            cask.sub!(/^  version "[^"]+"$/, "  version \"#{ENV.fetch("VERSION")}\"")
            cask.sub!(/^  sha256 "[0-9a-f]{64}"$/, "  sha256 \"#{ENV.fetch("SHA256")}\"")
            File.write("torli-stats.rb", cask)
          '
          shasum -a 256 "$ARCHIVE_NAME" torli-stats.rb > SHA256SUMS


      - name: Upload build artifact
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TorliStats-${{ steps.version.outputs.version }}-macos-arm64
          path: |
            ${{ steps.version.outputs.archive }}
            torli-stats.rb
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Create version tag
        if: steps.release.outputs.publish == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            if [[ "$(git rev-list -n 1 "$TAG")" != "$GITHUB_SHA" ]]; then
              echo "Existing tag $TAG does not point to this commit; refusing to publish." >&2
              exit 1
            fi
            echo "Tag $TAG already exists for this commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Torli Stats $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ARCHIVE_NAME: ${{ steps.version.outputs.archive }}
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { inside=1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > "$NOTES_FILE"

          if [[ -s "$NOTES_FILE" ]]; then
            gh release create "$TAG" "$ARCHIVE_NAME" torli-stats.rb SHA256SUMS \
              --title "Torli Stats $VERSION" \
              --notes-file "$NOTES_FILE" \
              --verify-tag
          else
            gh release create "$TAG" "$ARCHIVE_NAME" torli-stats.rb SHA256SUMS \
              --title "Torli Stats $VERSION" \
              --generate-notes \
              --verify-tag
          fi

      - name: Update Homebrew cask on main
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp torli-stats.rb "$RUNNER_TEMP/torli-stats.rb"
          git fetch origin main
          git checkout -B update-homebrew-cask FETCH_HEAD
          CURRENT_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "$CURRENT_VERSION" != "$VERSION" ]]; then
            echo "main has advanced to $CURRENT_VERSION; not updating the cask for $VERSION."
            exit 0
          fi
          cp "$RUNNER_TEMP/torli-stats.rb" Casks/torli-stats.rb
          git add Casks/torli-stats.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Homebrew cask to $VERSION"
          git push origin HEAD:main
