name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build app
        env:
          CODE_SIGN_IDENTITY: "-"
          SKIP_INSTALL: "1"
        run: ./build-app.sh

      - name: Archive app
        env:
          ARCHIVE_NAME: TorliStats-${{ github.ref_name }}-macos-arm64.zip
        run: ditto -c -k --sequesterRsrc --keepParent TorliStats.app "$ARCHIVE_NAME"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TorliStats-${{ github.ref_name }}-macos-arm64
          path: TorliStats-${{ github.ref_name }}-macos-arm64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_NAME: TorliStats-${{ github.ref_name }}-macos-arm64.zip
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            # Every successful main build gets a unique prerelease. Version tags
            # remain available for stable releases such as v0.1.0.
            RELEASE_TAG="main-${GITHUB_RUN_NUMBER}"
            RELEASE_TITLE="Main build #${GITHUB_RUN_NUMBER}"
            RELEASE_FLAGS=(--prerelease --target "$GITHUB_SHA")
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
            RELEASE_TITLE="$RELEASE_TAG"
            RELEASE_FLAGS=(--verify-tag)
          fi

          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          awk -v tag="$RELEASE_TAG" '
            $0 == "## [" tag "]" { inside=1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > "$NOTES_FILE"

          if [[ ! -s "$NOTES_FILE" ]]; then
            awk '
              /^## \[Unreleased\]/ { inside=1; next }
              inside && /^## / { exit }
              inside { print }
            ' CHANGELOG.md > "$NOTES_FILE"
          fi

          if [[ -s "$NOTES_FILE" ]]; then
            gh release create "$RELEASE_TAG" "$ARCHIVE_NAME" \
              --title "$RELEASE_TITLE" \
              --notes-file "$NOTES_FILE" \
              "${RELEASE_FLAGS[@]}"
          else
            gh release create "$RELEASE_TAG" "$ARCHIVE_NAME" \
              --title "$RELEASE_TITLE" \
              --generate-notes \
              "${RELEASE_FLAGS[@]}"
          fi
